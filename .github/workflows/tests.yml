name: Pruebas FerroSync
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ferrosync_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: git diff --exit-code -- app.js index.html
      - run: npm run check
      - run: npm test
      - run: npm run test:viajes
      - run: npm run test:server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ferrosync_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-navegador
          path: artifacts/
  publicar-vercel:
    needs: navegador
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Gh5AA87CqIDa1XJrkV9vYYj9
      VERCEL_PROJECT_ID: prj_3d2WrAGRf5RO3gyGtvkAL3dufQRh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar autorización de publicación
        run: test -n "$VERCEL_TOKEN"
      - run: npm ci
      - run: npx --yes vercel@59.23.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@59.23.2 build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@59.23.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
